name: Build All Platforms
run-name: SimpleCamPTZ ${{ inputs.platform || 'automatic-selection' }} packages ${{ inputs.source_revision || github.sha }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (macos = Apple Silicon)'
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - macos-intel
          - windows
          - linux
      source_revision:
        description: 'Source revision to package (blank = selected branch HEAD)'
        required: false
        type: string
  # Validate build-infrastructure changes. Ordinary source edits do not trigger
  # paid runners; ci/push-platform.txt scopes infrastructure validation.
  # Use Run workflow -> all for a complete release package set.
  push:
    paths:
      - '.github/workflows/build-all.yml'
      - 'ci/**'

permissions:
  contents: read

concurrency:
  group: simplecam-packages-${{ inputs.platform || 'automatic-selection' }}-${{ inputs.source_revision || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.meta.outputs.revision }}
      package: ${{ steps.meta.outputs.package }}
      platform: ${{ steps.select.outputs.platform }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          persist-credentials: false
      - name: Select native platforms
        id: select
        env:
          SELECTED_PLATFORM: ${{ inputs.platform }}
        run: python3 ci/select_platforms.py --event "$GITHUB_EVENT_NAME" --platform "$SELECTED_PLATFORM"
      - name: Record exact source revision
        id: meta
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          version = json.loads(Path('buildspec.json').read_text())['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'revision={revision}\npackage=SimpleCamPTZ-{version}-{revision[:9]}\n')
          PY

  native:
    name: Build ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install cmake==3.31.10 ninja==1.11.1.4
      - name: Select the OBS-required macOS SDK
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
      - name: Install Ubuntu SDK dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config extra-cmake-modules \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev \
            libjansson-dev libsimde-dev uthash-dev zlib1g-dev uuid-dev libglib2.0-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libxcb-shm0-dev libxcb-xinput-dev libglvnd-dev libegl1-mesa-dev libdrm-dev \
            qt6-base-dev libqt6svg6-dev xvfb xauth
      - name: Ensure Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $locations = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe")
          if (-not ($locations | Where-Object { Test-Path $_ })) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
      - name: Cache verified dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .ci-downloads
            .deps/*.zip
          key: simplecam-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('buildspec.json', 'ci/dependencies.json') }}
      - name: Configure second loopback camera address
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up
      - name: Native compile, automated tests, and package
        run: python ci/native_build.py --platform ${{ matrix.platform }}
      - name: Upload platform package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.platform }}
          path: packages/
          if-no-files-found: error
          retention-days: 7
      - name: Upload test and configure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            out/build/**/Testing/Temporary/*.log
            out/build/**/CMakeFiles/CMakeConfigureLog.yaml
            .ci-sdk/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7

  collect:
    name: Collect all four native installers
    needs: [prepare, native]
    if: needs.prepare.outputs.platform == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: installers/
      - name: Verify all packages have the same revision
        env:
          EXPECTED_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('installers')
          for platform in ('Windows', 'macOS-AppleSilicon', 'macOS-Intel', 'Linux'):
              info = json.loads((root / platform / 'BUILD-INFO.json').read_text())
              assert info['revision'] == os.environ['EXPECTED_REVISION'], platform
              assert info['automated_tests'] == 'passed', platform
          (root / 'README.txt').write_text('SimpleCamPTZ Windows, Intel macOS, Apple Silicon macOS, and Ubuntu 24.04 packages.\n'
              'Each folder contains installation instructions, checksums and source revision.\n'
              'CI compilation/tests do not establish OBS runtime or physical camera compatibility.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.prepare.outputs.package }}-AllPlatforms
          path: installers/
          if-no-files-found: error
          retention-days: 7
